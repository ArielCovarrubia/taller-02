name: icinf1108-taller-02

services:
  # 1. Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: taller02-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taller02_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen persistente nombrado para que los datos no se borren
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taller02_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Administrador visual de base de datos (Adminer)
  db-admin:
    image: adminer:latest
    container_name: taller02-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app-network

  # 3. API de NestJS
  api:
    build:
      context: .
      target: dev
    image: icinf1108-api:dev
    container_name: taller02-api-dev
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      TSC_WATCHFILE: UsePollingWatchFile
      TSC_WATCHDIRECTORY: UsePollingWatchDirectory
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

# Volúmenes persistentes nombrados (cumple criterio de persistencia)
volumes:
  postgres_data:

# Red interna que conecta los 3 contenedores
networks:
  app-network:
    driver: bridge